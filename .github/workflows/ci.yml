name: Gee Clipper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m py_compile bot.py config.py core.py grade.py music.py video.py storage.py voiceover.py payments.py
      - name: Run storage and video tests
        run: python -m unittest discover -s tests -v
